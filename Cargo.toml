[package]
name = "brisklark"
version = "0.1.0"
edition = "2024"
description = "A small, fast, quiet browser for Windows on WebView2, with Brave's ad blocker built in"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = { version = "0.37.3", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57.3", default-features = false }
# Same versions wry itself uses, so the COM types line up.
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
adblock = "0.13.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
