[package]
name = "brisklark"
version = "0.2.0"
edition = "2024"
description = "A small, fast, quiet browser for Windows on WebView2, with Brave's ad blocker built in"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = { version = "0.37.3", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57.3", default-features = false, features = ["devtools"] }
# Same versions wry itself uses, so the COM types line up.
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
] }
adblock = "0.13.6"
base64 = "0.23"
# Both already come with adblock: the public suffix list, and Brave's debounce patterns.
psl = "2.1"
regex = "1"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
