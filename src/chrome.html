<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: #f3f3f3; --fg: #1b1b1b; --dim: #6b6b6b; --hover: #e4e4e4; --sel: #ffffff;
  --line: #dcdcdc; --accent: #2f6fde; --field: #ffffff; --shadow: 0 8px 30px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1f1f1f; --fg: #e8e8e8; --dim: #9a9a9a; --hover: #2c2c2c; --sel: #353535;
    --line: #333; --accent: #6ea0ff; --field: #2a2a2a; --shadow: 0 8px 30px rgba(0,0,0,.6);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font: 13px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
       user-select: none; }
#side { display: flex; flex-direction: column; height: 100%; padding: 8px; gap: 6px; }
#box { position: relative; }
#field { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px;
         background: var(--field); color: var(--fg); font: inherit; outline: none; }
#field:focus { border-color: var(--accent); }
#sugg { list-style: none; margin: 4px 0 0; padding: 0; }
#sugg li, .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: default; overflow: hidden; }
#sugg li.on, .row:hover, #sugg li:hover { background: var(--hover); }
.t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.kind { color: var(--dim); font-size: 11px; }
#pins { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
#pins:empty { display: none; }
.pin { height: 40px; border-radius: 8px; background: var(--hover); display: grid; place-items: center; }
.pin.active { background: var(--sel); outline: 1px solid var(--line); }
#tabs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
.tab.active { background: var(--sel); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tab .x { visibility: hidden; border: 0; background: none; color: var(--dim); font-size: 14px; padding: 0 2px; }
.tab:hover .x { visibility: visible; }
.icon { width: 16px; height: 16px; flex: none; border-radius: 3px; display: grid; place-items: center;
        font-size: 10px; font-weight: 600; background: var(--line); color: var(--fg); }
img.icon { background: none; }
.private .icon { background: #7b4fd6; color: #fff; }
#bar { display: flex; gap: 2px; border-top: 1px solid var(--line); padding-top: 6px; }
#bar button { flex: 1; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--dim); font: inherit; font-size: 14px; }
#bar button:hover { background: var(--hover); color: var(--fg); }
#bar button.on { color: var(--accent); }

/* minimize, maximize, close: in place of Windows' title bar */
#win { display: flex; justify-content: flex-end; margin: -8px -8px 0; flex: none; }
#win button { width: 46px; height: 32px; border: 0; background: none; color: var(--fg);
  font: 10px "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
#win button:hover { background: var(--hover); }
#win #w-close:hover { background: #c42b1c; color: #fff; }
body.top #win { order: 9; margin: -6px -8px -6px 4px; align-self: stretch; }
body.top #win button { height: 44px; }
body.overlay.folded #win { display: none; }

/* tabs across the top */
body.top #side { flex-direction: row; align-items: center; padding: 6px 8px; height: 44px; }
body.top #box { display: none; }
body.top #pins { display: flex; flex: none; }
body.top .pin { width: 32px; height: 30px; }
body.top #tabs { flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 4px; }
body.top .tab { flex: 0 1 200px; min-width: 60px; }
body.top #tabs::-webkit-scrollbar { display: none; }
.add { color: var(--dim); }
.add .plus { width: 16px; text-align: center; font-size: 16px; line-height: 16px; }
body.top .add { flex: none; width: 30px; justify-content: center; padding: 6px 0; }
body.top .add .label { display: none; }
body.top #bar { border: 0; padding: 0; flex: none; }
body.top #bar button { width: 32px; flex: none; }

/* the command bar and panels, over the whole window */
/* Over the page the tabs stay where they are, as in any browser, and the field
   floats in the page area. Folded away, the tabs stay hidden. */
body.overlay:not(.top) #side { width: 240px; }
body.overlay:not(.top):not(.folded) #box { left: calc(50% + 120px); width: min(640px, calc(100vw - 280px)); }
body.overlay.folded #pins, body.overlay.folded #tabs, body.overlay.folded #bar { display: none; }
body.overlay #box, #panel { display: block; position: fixed; left: 50%; top: 12vh; transform: translateX(-50%);
  width: min(640px, 92vw); background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px; box-shadow: var(--shadow); }
body.overlay #field { height: 40px; font-size: 15px; }
#panel { display: none; max-height: 76vh; flex-direction: column; }
#panel.open { display: flex; }
body.overlay.panel #box { display: none; }
#panel h2 { font-size: 14px; margin: 2px 4px 8px; }
#panel input { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px;
  background: var(--field); color: var(--fg); font: inherit; outline: none; margin-bottom: 6px; }
#plist { overflow-y: auto; }
</style>
</head>
<body>
<div id="side">
  <div id="win">
    <button id="w-min" title="Minimize">&#xE921;</button><button id="w-max" title="Maximize">&#xE922;</button><button id="w-close" title="Close">&#xE8BB;</button>
  </div>
  <div id="box"><input id="field" spellcheck="false" autocomplete="off"><ul id="sugg"></ul></div>
  <div id="pins"></div>
  <div id="tabs"></div>
  <div id="bar">
    <button id="b-mark" title="Bookmark this page (Ctrl+Shift+B)">☆</button>
    <button id="b-bookmarks" title="Bookmarks (Ctrl+Shift+O)">▤</button>
    <button id="b-history" title="History (Ctrl+Y)">◷</button>
    <button id="b-layout" title="Tabs on the left or across the top (Ctrl+Shift+S)">⇆</button>
  </div>
</div>
<div id="panel"><h2 id="ptitle"></h2><input id="pq" placeholder="Filter" spellcheck="false"><div id="plist"></div></div>
<script>
const $ = id => document.getElementById(id);
const post = o => window.ipc.postMessage(JSON.stringify(o));
const field = $('field'), sugg = $('sugg'), body = document.body;
let S = { tabs: [] }, mode = 'here', items = [], sel = 0, panelKind = null, finishing = false;

const hostOf = u => { try { return new URL(u).host; } catch { return ''; } };
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function icon(t) {
  const letter = el('span', 'icon', ((t.title || hostOf(t.url) || '?').replace(/^www\./, '')[0] || '?').toUpperCase());
  const h = hostOf(t.url);
  if (t.private || !/^https?:/.test(t.url) || !h) return letter;
  const img = el('img', 'icon'); img.src = `https://${h}/favicon.ico`;
  img.onerror = () => img.replaceWith(letter);
  return img;
}
function wire(node, t) {
  node.onclick = () => post({ cmd: 'select', id: t.id });
  node.onauxclick = e => { if (e.button === 1) post({ cmd: 'close', id: t.id }); };
  node.oncontextmenu = e => { e.preventDefault(); post({ cmd: 'pin', id: t.id }); };
  node.title = `${t.title}\n${t.url}${t.private ? '\nPrivate' : ''}\nRight-click to ${t.pinned ? 'unpin' : 'pin'}`;
}

function render(s) {
  S = s;
  // The app decides whether anything covers the page; a panel or box it has
  // put away must not stay drawn in the strip.
  if (!s.overlay && body.classList.contains('overlay')) { closePanel(); items = []; sugg.replaceChildren(); body.classList.remove('overlay'); }
  body.classList.toggle('top', s.top);
  body.classList.toggle('folded', !!s.folded);
  const pins = $('pins'), tabs = $('tabs');
  pins.replaceChildren(); tabs.replaceChildren();
  for (const t of s.tabs) {
    if (t.pinned) {
      const p = el('div', 'pin' + (t.active ? ' active' : '')); p.append(icon(t)); wire(p, t); pins.append(p);
    } else {
      const r = el('div', 'row tab' + (t.active ? ' active' : '') + (t.private ? ' private' : ''));
      const x = el('button', 'x', '×');
      x.onclick = e => { e.stopPropagation(); post({ cmd: 'close', id: t.id }); };
      r.append(icon(t), el('span', 't', t.title || t.url), x); wire(r, t); tabs.append(r);
    }
  }
  // New tab sits right after the last tab, as in any browser.
  const add = el('div', 'row add');
  add.title = 'New tab (Ctrl+T)';
  add.append(el('span', 'plus', '+'), el('span', 't label', 'New Tab'));
  add.onclick = () => post({ cmd: 'command', name: 'new' });
  tabs.append(add);
  $('b-mark').textContent = s.bookmarked ? '★' : '☆';
  $('b-mark').classList.toggle('on', s.bookmarked);
  if (document.activeElement !== field) {
    const a = s.tabs.find(t => t.active);
    field.value = a ? hostOf(a.url).replace(/^www\./, '') || a.url : '';
    field.placeholder = 'Search or enter address';
  }
}

function focusField(o) {
  mode = o.mode; closePanel(); finishing = false;
  body.classList.toggle('overlay', o.overlay);
  field.placeholder = { tabs: 'Switch to tab…', private: 'Private tab: search or enter address', new: 'New tab: search or enter address' }[mode] || 'Search or enter address';
  field.value = o.text || '';
  field.focus(); field.select();
  query();
}
function query() { post({ cmd: 'suggest', q: field.value, tabs: mode === 'tabs' }); }
function suggest(list) {
  if (document.activeElement !== field) return;
  items = list; sel = 0; sugg.replaceChildren();
  list.forEach((it, i) => {
    const li = el('li', i === sel ? 'on' : '');
    li.append(it.kind === 'go' ? el('span', 'kind', '→') : icon(it), el('span', 't', it.kind === 'go' ? it.url : (it.title || it.url)));
    if (it.kind !== 'go') li.append(el('span', 'u', it.kind === 'tab' ? 'Switch to tab' : hostOf(it.url)));
    li.onmousedown = e => { e.preventDefault(); pick(it); };
    sugg.append(li);
  });
}
function pick(it) {
  if (it && it.kind === 'tab') post({ cmd: 'select', id: it.id });
  else if (it) post({ cmd: 'go', text: it.url, mode });
  else if (field.value.trim()) post({ cmd: 'go', text: field.value, mode });
  else return finish();
  reset();
}
function reset() { items = []; sugg.replaceChildren(); body.classList.remove('overlay'); finishing = true; field.blur(); finishing = false; }
function finish() { reset(); post({ cmd: 'done' }); render(S); }

field.oninput = query;
// Switching to another window is not leaving the box.
field.onblur = () => { if (!finishing && !panelKind && (document.hasFocus() || !body.classList.contains('overlay'))) finish(); };
field.onkeydown = e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!items.length) return;
    sel = (sel + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
    [...sugg.children].forEach((li, i) => li.classList.toggle('on', i === sel));
  } else if (e.key === 'Enter') { e.preventDefault(); pick(items[sel]); }
  else if (e.key === 'Escape') { e.preventDefault(); finish(); }
};
field.onfocus = () => { if (!body.classList.contains('overlay') && mode !== 'tabs') { mode = 'here'; query(); } };

// History and bookmarks panels
const pq = $('pq');
function panel(o) {
  panelKind = o.kind;
  body.classList.add('overlay', 'panel');
  $('panel').classList.add('open');
  $('ptitle').textContent = o.kind === 'history' ? 'History' : 'Bookmarks';
  if (document.activeElement !== pq) { pq.value = ''; pq.focus(); }
  const list = $('plist'); list.replaceChildren();
  if (!o.items.length) list.append(el('div', 'row u', 'Nothing here yet.'));
  for (const it of o.items) {
    const r = el('div', 'row');
    r.append(icon(it), el('span', 't', it.title || it.url),
             el('span', 'u', it.last ? new Date(it.last * 1000).toLocaleString() : hostOf(it.url)));
    if (o.kind === 'bookmarks') {
      const x = el('button', 'x', '×'); x.style.visibility = 'visible';
      x.style.cssText += 'border:0;background:none;color:var(--dim);font-size:14px';
      x.onclick = e => { e.stopPropagation(); post({ cmd: 'unbookmark', url: it.url }); };
      r.append(x);
    }
    r.title = it.url;
    r.onclick = () => { closePanel(); body.classList.remove('overlay'); post({ cmd: 'go', text: it.url, mode: 'here' }); };
    list.append(r);
  }
}
function closePanel() { panelKind = null; $('panel').classList.remove('open'); body.classList.remove('panel'); }
pq.oninput = () => post({ cmd: 'panel', kind: panelKind, q: pq.value });
pq.onkeydown = e => { if (e.key === 'Escape') { closePanel(); finish(); } };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && panelKind) { closePanel(); finish(); } });
// A click on the empty space around the box or a panel puts it away, as Esc does,
// whether or not the box had the cursor.
document.addEventListener('mousedown', e => {
  if (!body.classList.contains('overlay') || e.target.closest('#box, #panel, #side')) return;
  e.preventDefault();
  closePanel(); finish();
});

// Empty parts of the tab row or sidebar hold the window, as a title bar would.
const side = $('side');
const holds = t => t === side || t === $('win') || t === $('tabs') || t === $('pins');
side.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (e.clientY <= 4 && !body.classList.contains('overlay')) { e.preventDefault(); return post({ cmd: 'resize-top' }); }
  if (holds(e.target) && e.detail === 1) { e.preventDefault(); post({ cmd: 'drag' }); }
});
side.addEventListener('dblclick', e => { if (holds(e.target)) post({ cmd: 'maximize' }); });
$('w-min').onclick = () => post({ cmd: 'minimize' });
$('w-max').onclick = () => post({ cmd: 'maximize' });
$('w-close').onclick = () => post({ cmd: 'quit' });

$('b-mark').onclick = () => post({ cmd: 'command', name: 'bookmark' });
$('b-history').onclick = () => post({ cmd: 'command', name: 'history' });
$('b-bookmarks').onclick = () => post({ cmd: 'command', name: 'bookmarks' });
$('b-layout').onclick = () => post({ cmd: 'command', name: 'layout' });
post({ cmd: 'ready' });
</script>
</body>
</html>
