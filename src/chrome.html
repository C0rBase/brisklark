<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: #f4f4f5; --fg: #18181b; --dim: #71717a; --hover: rgba(0,0,0,.055); --sel: #ffffff;
  --line: rgba(0,0,0,.09); --accent: #2563eb; --field: #ffffff; --card: #ffffff;
  --shadow: 0 12px 40px rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1f; --fg: #ececee; --dim: #a1a1aa; --hover: rgba(255,255,255,.07); --sel: #2e2e33;
    --line: rgba(255,255,255,.09); --accent: #5b8def; --field: #2a2a2e; --card: #26262a;
    --shadow: 0 12px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font: 13px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
       user-select: none; }
#side { display: flex; flex-direction: column; height: 100%; padding: 8px; gap: 6px; }
#box { position: relative; }
#field { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px;
         background: var(--field); color: var(--fg); font: inherit; outline: none; }
#field:focus { border-color: var(--accent); }
#sugg { list-style: none; margin: 4px 0 0; padding: 0; }
#sugg li, .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: default; overflow: hidden; }
#sugg li.on, .row:hover, #sugg li:hover { background: var(--hover); }
.t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.kind { color: var(--dim); font-size: 11px; }
#pins { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
#pins:empty { display: none; }
.pin { height: 40px; border-radius: 8px; background: var(--hover); display: grid; place-items: center; }
.pin.active { background: var(--sel); outline: 1px solid var(--line); }
#tabs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
.tab.active { background: var(--sel); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tab .x { visibility: hidden; border: 0; background: none; color: var(--dim); font-size: 14px; padding: 0 2px; }
.tab:hover .x { visibility: visible; }
.icon { width: 16px; height: 16px; flex: none; border-radius: 3px; display: grid; place-items: center;
        font-size: 10px; font-weight: 600; background: var(--line); color: var(--fg); }
img.icon { background: none; }
.private .icon { background: #7b4fd6; color: #fff; }
#bar { display: flex; gap: 2px; border-top: 1px solid var(--line); padding-top: 6px; }
#bar button { flex: 1; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--dim); font: inherit; font-size: 14px; }
#bar button:hover { background: var(--hover); color: var(--fg); }
#bar button.on { color: var(--accent); }

/* minimize, maximize, close: in place of Windows' title bar */
#win { display: flex; justify-content: flex-end; margin: -8px -8px 0; flex: none; min-height: 32px; }
#win button { width: 46px; height: 32px; border: 0; background: none; color: var(--fg);
  font: 10px "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
#win button:hover { background: var(--hover); }
#win #w-close:hover { background: #c42b1c; color: #fff; }
body.top #win { margin: 0 -8px 0 4px; align-self: start; }
body.top #win button { height: 34px; }
body.overlay.folded #win { display: none; }

/* back, forward, reload: in the window-button row on the left, or the toolbar on top */
#side { position: relative; }
#nav { display: flex; gap: 2px; flex: none; position: absolute; top: 2px; left: 6px; z-index: 1; }
#nav button, #b-menu { width: 30px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--fg);
  font: 13px "Segoe Fluent Icons", "Segoe MDL2 Assets"; display: grid; place-items: center; padding: 0; }
#nav button:hover:not(:disabled), #b-menu:hover { background: var(--hover); }
#nav button:disabled { color: var(--dim); opacity: .45; }
#addr { display: none; }
body.overlay.folded #nav { display: none; }

/* tabs across the top: a row of tabs from the left edge, and a toolbar under it, as in Chrome */
body.top #side { display: flex; flex-flow: row wrap; align-content: flex-start; align-items: center; gap: 0 6px;
  padding: 0 0 0 8px; height: 78px; }
body.top #side::before { content: ''; order: 4; flex-basis: 100%; height: 0; } /* the line break between the rows */
body.top #pins { order: 1; height: 38px; align-items: center; }
body.top #pins:empty { display: none; }
body.top #tabs { order: 2; flex: 1 1 0; min-width: 0; height: 38px; align-items: center; }
body.top #win { order: 3; }
body.top #nav { order: 5; position: static; height: 40px; align-items: center; }
body.top #addr { order: 6; flex: 1 1 0; display: flex; align-items: center; gap: 8px; height: 32px; min-width: 0;
  padding: 0 12px; border-radius: 16px; background: var(--field); border: 1px solid var(--line); cursor: text; }
body.top #addr:hover { border-color: var(--dim); }
#addr .lock { font: 11px "Segoe Fluent Icons", "Segoe MDL2 Assets"; color: var(--dim); flex: none; }
#addr .u { flex: 1; max-width: none; font-size: 13px; color: var(--fg); }
#addr .u .h { color: var(--fg); } #addr .u .p { color: var(--dim); }
body.top #bar { order: 7; height: 40px; align-items: center; padding-right: 8px; }
body.overlay.folded #addr { display: none; }
/* old one-row top bar, kept for what still applies */
body.top #box { display: none; }
body.top #pins { display: flex; flex: none; }
body.top .pin { width: 32px; height: 30px; }
body.top #tabs { flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 4px; }
body.top .tab { flex: 0 1 200px; min-width: 60px; }
body.top #tabs::-webkit-scrollbar { display: none; }
.add { color: var(--dim); }
.add .plus { width: 16px; text-align: center; font-size: 16px; line-height: 16px; }
body.top .add { flex: none; width: 30px; justify-content: center; padding: 6px 0; }
body.top .add .label { display: none; }
body.top #bar { border: 0; padding: 0; flex: none; }
body.top #bar button { width: 32px; flex: none; }

/* the command bar and panels, over the whole window */
/* Over the page the tabs stay where they are, as in any browser, and the field
   floats in the page area. Folded away, the tabs stay hidden. */
body.overlay:not(.top) #side { width: 240px; }
body.overlay:not(.top):not(.folded) #box { left: calc(50% + 120px); width: min(640px, calc(100vw - 280px)); }
body.overlay.folded #pins, body.overlay.folded #tabs, body.overlay.folded #bar { display: none; }
body.overlay #box, #panel { display: block; position: fixed; left: 50%; top: 12vh; transform: translateX(-50%);
  width: min(640px, 92vw); background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px; box-shadow: var(--shadow); }
body.overlay #field { height: 40px; font-size: 15px; }
#panel { display: none; max-height: 76vh; flex-direction: column; }
#panel.open { display: flex; }
body.overlay.panel #box { display: none; }
#panel h2 { font-size: 14px; margin: 2px 4px 8px; }
#pq { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px;
  background: var(--field); color: var(--fg); font: inherit; outline: none; margin-bottom: 6px; }
#plist { overflow-y: auto; flex: 1; min-width: 0; }
.sbody { display: flex; gap: 14px; min-height: 0; flex: 1 1 auto; }
#snav { display: none; }
#panel.settings { width: min(1000px, 94vw); height: 84vh; max-height: 84vh; top: 7vh; }
#panel.settings #snav { display: flex; flex-direction: column; gap: 1px; width: 220px; flex: none; overflow-y: auto; }
#snav button { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: none; color: var(--fg);
  font: inherit; padding: 8px 10px; border-radius: 7px; }
#snav button:hover { background: var(--hover); }
#snav button.on { background: var(--hover); color: var(--accent); font-weight: 600; }
#snav .ic { font: 14px "Segoe Fluent Icons", "Segoe MDL2 Assets"; width: 16px; text-align: center; }
#panel.settings h3 { font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--fg); margin: 22px 8px 6px; }
#panel h4 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); margin: 14px 8px 4px; }
.set > .t { flex: 1; min-width: 0; }
.grp { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; flex: none; max-width: 60%; }
.txt { height: 30px; width: 260px; border: 1px solid var(--line); border-radius: 7px; padding: 0 10px; background: var(--field); color: var(--fg); font: inherit; }
#plist select { height: 30px; border: 1px solid var(--line); border-radius: 7px; background: var(--field); color: var(--fg); font: inherit; padding: 0 6px; max-width: 260px; }
.spacer { height: 60vh; }
#addr .store { flex: none; border: 0; border-radius: 12px; padding: 3px 10px; background: var(--accent); color: #fff; font: 12px inherit; cursor: pointer; }
#addr .store:disabled { opacity: .6; }

/* glyphs from Windows' own icon font */
.g { font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets" !important; }
.snd { border: 0; background: none; color: var(--dim); font-size: 12px; padding: 0 2px; flex: none; }
.snd:hover { color: var(--fg); }
.snd.muted { color: var(--accent); }
/* the two-pages mark on tabs in a split view */
.sm { width: 13px; height: 10px; flex: none; border: 1.5px solid var(--dim); border-radius: 2px;
      background: linear-gradient(90deg, transparent 42%, var(--dim) 42% 58%, transparent 58%); }
.tab.shown:not(.active) { box-shadow: inset 0 0 0 1px var(--line); }
#b-shield { display: flex; align-items: center; justify-content: center; gap: 3px; }
#b-shield .n { font: 600 10px "Segoe UI", sans-serif; }
#b-shield.down { opacity: .45; }

/* Settings */
#panel.settings #pq { display: none; }
#panel h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--dim);
            margin: 14px 4px 4px; }
#panel h3:first-child { margin-top: 2px; }
.set { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 6px; min-height: 36px; }
.set .t { white-space: normal; }
.set .hint { display: block; color: var(--dim); font-size: 11px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
.seg button, .btn { border: 0; background: none; color: var(--fg); font: inherit; padding: 5px 10px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: #fff; }
.btn { border: 1px solid var(--line); border-radius: 7px; flex: none; }
.btn:hover:not(:disabled), .seg button:hover:not(.on) { background: var(--hover); }
.btn:disabled { color: var(--dim); }
.btn.warn { border-color: #c42b1c; color: #c42b1c; }
select { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; }
.sw { appearance: none; width: 36px; height: 20px; border-radius: 10px; background: var(--line); position: relative; flex: none; margin: 0; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .12s; }
.sw:checked { background: var(--accent); }
.sw:checked::after { left: 19px; }
#panel a { color: var(--accent); cursor: pointer; }

/* ---- polish: tabs, toolbar, field ---- */
.row { transition: background .12s; }
.tab { height: 34px; border-radius: 8px; }
.tab.active { background: var(--sel); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.tab .x { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; line-height: 1; }
.tab .x:hover { background: var(--hover); color: var(--fg); }
.tab.active .x { visibility: visible; }
.icon { border-radius: 4px; font-size: 9px; background: var(--hover); color: var(--dim); }
img.icon { object-fit: contain; }
#bar { gap: 4px; }
#bar button { border-radius: 8px; font: 15px "Segoe Fluent Icons", "Segoe MDL2 Assets"; color: var(--dim); }
#bar button.on { color: #f5b301; }
#b-shield { color: #e8590c !important; }
#b-shield.down { color: var(--dim) !important; }
body.top #bar button { width: 34px; height: 32px; }
body.top #addr { border-radius: 10px; border-color: transparent; background: var(--hover); }
body.top #addr:hover { border-color: var(--line); background: var(--field); }
#field { border-radius: 10px; }
body.overlay #box, #panel { border-radius: 14px; border: 0; box-shadow: var(--shadow); }

/* ---- Settings: a nav on the left, one section on the right, rows in cards ---- */
#panel.settings { padding: 0; overflow: hidden; background: var(--bg); }
#panel.settings #ptitle { display: none; }
#panel.settings .sbody { gap: 0; height: 100%; }
#panel.settings #snav { width: 232px; padding: 18px 10px; gap: 2px; border-right: 1px solid var(--line); background: var(--bg); }
#panel.settings #snav::before { content: 'Settings'; font: 600 18px "Segoe UI Variable Display", "Segoe UI", sans-serif; padding: 4px 12px 14px; }
#snav button { padding: 9px 12px; border-radius: 8px; color: var(--fg); }
#snav button.on { background: var(--hover); color: var(--fg); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
#snav .ic { color: var(--dim); }
#snav button.on .ic { color: var(--accent); }
#panel.settings #plist { padding: 22px 32px 40px; }
#plist .page { display: none; max-width: 760px; margin: 0 auto; }
#plist .page.on { display: block; }
#panel.settings h3 { font: 600 22px "Segoe UI Variable Display", "Segoe UI", sans-serif; margin: 6px 2px 16px; }
#panel.settings h4 { font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--dim); margin: 22px 4px 8px; }
.card { background: var(--card); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.card .set { border-radius: 0; padding: 12px 16px; min-height: 56px; }
.card .set + .set { border-top: 1px solid var(--line); }
.set .t { font-size: 13.5px; }
.set .hint { margin-top: 2px; font-size: 12px; }
.seg { border-radius: 8px; background: var(--hover); border: 0; padding: 2px; gap: 2px; }
.seg button { border-radius: 6px; padding: 5px 12px; }
.seg button + button { border-left: 0; }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 600; }
.btn { border-radius: 8px; padding: 6px 14px; background: var(--card); }
.txt, #plist select { border-radius: 8px; height: 32px; }
.sw { width: 40px; height: 22px; border-radius: 11px; background: var(--dim); opacity: .55; cursor: pointer; }
.sw:checked { opacity: 1; }
.sw::after { width: 16px; height: 16px; top: 3px; left: 3px; transition: left .15s; }
.sw:checked::after { left: 21px; }
.about { display: flex; gap: 14px; align-items: flex-start; padding: 16px; }
.about .name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
#panel:focus { outline: none; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--dim); }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="side">
  <div id="win">
    <button id="w-min" title="Minimize">&#xE921;</button><button id="w-max" title="Maximize">&#xE922;</button><button id="w-close" title="Close">&#xE8BB;</button>
  </div>
  <div id="nav">
    <button id="n-back" title="Back (Alt+Left)">&#xE72B;</button><button id="n-fwd" title="Forward (Alt+Right)">&#xE72A;</button><button id="n-reload" title="Reload (F5)">&#xE72C;</button>
  </div>
  <div id="addr" title="Search or enter address (Ctrl+L)"><span class="lock"></span><span class="t u"></span></div>
  <div id="box"><input id="field" spellcheck="false" autocomplete="off"><ul id="sugg"></ul></div>
  <div id="pins"></div>
  <div id="tabs"></div>
  <div id="bar">
    <button id="b-mark" class="g" title="Bookmark this page (Ctrl+Shift+B)">&#xE734;</button>
    <button id="b-shield" class="g" title="Shields"></button>
    <button id="b-ext" class="g" title="Extensions">&#xEA86;</button>
    <button id="b-menu" class="g" title="Menu (Alt+F)">&#xE712;</button>
  </div>
</div>
<div id="panel"><h2 id="ptitle"></h2><input id="pq" placeholder="Filter" spellcheck="false"><div class="sbody"><div id="snav"></div><div id="plist"></div></div></div>
<script>
const $ = id => document.getElementById(id);
const post = o => window.ipc.postMessage(JSON.stringify(o));
const field = $('field'), sugg = $('sugg'), body = document.body;
let S = { tabs: [] }, mode = 'here', items = [], sel = 0, panelKind = null, finishing = false;

const hostOf = u => { try { return new URL(u).host; } catch { return ''; } };
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
// The page's own favicon when the app knows it, else the site's /favicon.ico;
// one that failed once is not asked for again (no flicker on every render).
const badIcons = new Set();
function icon(t) {
  const letter = el('span', 'icon', ((hostOf(t.url) || t.title || '?').replace(/^www\./, '')[0] || '?').toUpperCase());
  const h = hostOf(t.url);
  const src = t.icon && /^(https?|data):/.test(t.icon) ? t.icon : !t.private && /^https?:/.test(t.url) && h ? `https://${h}/favicon.ico` : '';
  if (!src || badIcons.has(src)) return letter;
  const img = el('img', 'icon'); img.decoding = 'async'; img.draggable = false; img.src = src;
  img.onerror = () => { badIcons.add(src); img.replaceWith(letter); };
  return img;
}
function wire(node, t) {
  node.onclick = () => post({ cmd: 'select', id: t.id });
  node.onauxclick = e => { if (e.button === 1) post({ cmd: 'close', id: t.id }); };
  node.oncontextmenu = e => { e.preventDefault(); post({ cmd: 'tabmenu', id: t.id }); };
  node.title = `${t.title}\n${t.url}${t.private ? '\nPrivate' : ''}${t.split ? '\nIn a split view' : ''}`;
}
function sound(t) {
  const b = el('button', 'snd g' + (t.muted ? ' muted' : ''));
  b.innerHTML = t.muted ? '&#xE74F;' : '&#xE767;';
  b.title = t.muted ? 'Unmute site' : 'Mute site';
  b.onclick = e => { e.stopPropagation(); post({ cmd: 'mute', id: t.id }); };
  return b;
}

function render(s) {
  S = s;
  // The app decides whether anything covers the page; a panel or box it has
  // put away must not stay drawn in the strip.
  if (!s.overlay && body.classList.contains('overlay')) { closePanel(); items = []; sugg.replaceChildren(); body.classList.remove('overlay'); }
  body.classList.toggle('top', s.top);
  body.classList.toggle('folded', !!s.folded);
  const pins = $('pins'), tabs = $('tabs');
  pins.replaceChildren(); tabs.replaceChildren();
  for (const t of s.tabs) {
    if (t.pinned) {
      const p = el('div', 'pin' + (t.active ? ' active' : '')); p.append(icon(t)); wire(p, t); pins.append(p);
    } else {
      const r = el('div', 'row tab' + (t.active ? ' active' : '') + (t.shown ? ' shown' : '') + (t.private ? ' private' : ''));
      const x = el('button', 'x', '×');
      x.onclick = e => { e.stopPropagation(); post({ cmd: 'close', id: t.id }); };
      r.append(icon(t), el('span', 't', t.title || t.url));
      if (t.audio || t.muted) r.append(sound(t));
      if (t.split) r.append(el('span', 'sm'));
      r.append(x); wire(r, t); tabs.append(r);
    }
  }
  // New tab sits right after the last tab, as in any browser.
  const add = el('div', 'row add');
  add.title = 'New tab (Ctrl+T)';
  add.append(el('span', 'plus', '+'), el('span', 't label', 'New Tab'));
  add.onclick = () => post({ cmd: 'command', name: 'new' });
  tabs.append(add);
  $('n-back').disabled = !s.back;
  $('n-fwd').disabled = !s.forward;
  const rl = $('n-reload');
  rl.innerHTML = s.loading ? '&#xE711;' : '&#xE72C;';
  rl.title = s.loading ? 'Stop (Esc)' : 'Reload (F5)';
  rl.disabled = !s.live;
  const cur = s.tabs.find(t => t.active), u = cur && cur.url !== 'about:blank' ? cur.url : '';
  const addr = $('addr'), lock = addr.querySelector('.lock'), text = addr.querySelector('.u');
  lock.innerHTML = /^https:/.test(u) ? '&#xE72E;' : u ? '&#xE946;' : '&#xE721;';
  lock.title = /^https:/.test(u) ? 'Connection is secure' : u ? 'Not secure' : '';
  text.replaceChildren();
  if (u) {
    let h = hostOf(u), rest = u.replace(/^[a-z]+:\/\//, '').slice(h.length);
    if (!h) { h = u; rest = ''; }
    text.append(el('span', 'h', h.replace(/^www\./, '')), el('span', 'p', rest === '/' ? '' : rest));
  } else text.append(el('span', 'p', 'Search or enter address'));
  addr.querySelector('.store')?.remove();
  if (s.store) {
    const b = el('button', 'store', s.installing ? 'Adding…' : 'Add to Brisklark');
    b.disabled = !!s.installing;
    b.onclick = e => { e.stopPropagation(); post({ cmd: 'command', name: 'install' }); };
    addr.append(b);
  }
  $('b-mark').innerHTML = s.bookmarked ? '&#xE735;' : '&#xE734;';
  $('b-mark').classList.toggle('on', s.bookmarked);
  const sh = $('b-shield');
  sh.innerHTML = '&#xEA18;';
  if (s.shields && s.blocked) sh.append(el('span', 'n', s.blocked > 99 ? '99+' : s.blocked));
  sh.classList.toggle('down', !s.shields);
  sh.title = s.shields ? `Shields up: ${s.blocked} blocked on this page` : 'Shields down for this page';
  if (document.activeElement !== field) {
    const a = s.tabs.find(t => t.active);
    field.value = a ? hostOf(a.url).replace(/^www\./, '') || a.url : '';
    field.placeholder = 'Search or enter address';
  }
}

function focusField(o) {
  mode = o.mode; closePanel(); finishing = false;
  body.classList.toggle('overlay', o.overlay);
  field.placeholder = { tabs: 'Switch to tab…', private: 'Private tab: search or enter address', new: 'New tab: search or enter address' }[mode] || 'Search or enter address';
  field.value = o.text || '';
  field.focus(); field.select();
  query();
}
function query() { post({ cmd: 'suggest', q: field.value, tabs: mode === 'tabs' }); }
function suggest(list) {
  if (document.activeElement !== field) return;
  items = list; sel = 0; sugg.replaceChildren();
  list.forEach((it, i) => {
    const li = el('li', i === sel ? 'on' : '');
    li.append(it.kind === 'go' ? el('span', 'kind', '→') : icon(it), el('span', 't', it.kind === 'go' ? it.url : (it.title || it.url)));
    if (it.kind !== 'go') li.append(el('span', 'u', it.kind === 'tab' ? 'Switch to tab' : hostOf(it.url)));
    li.onmousedown = e => { e.preventDefault(); pick(it); };
    sugg.append(li);
  });
}
function pick(it) {
  if (it && it.kind === 'tab') post({ cmd: 'select', id: it.id });
  else if (it) post({ cmd: 'go', text: it.url, mode });
  else if (field.value.trim()) post({ cmd: 'go', text: field.value, mode });
  else return finish();
  reset();
}
function reset() { items = []; sugg.replaceChildren(); body.classList.remove('overlay'); finishing = true; field.blur(); finishing = false; }
function finish() { reset(); post({ cmd: 'done' }); render(S); }

field.oninput = query;
// Switching to another window is not leaving the box.
field.onblur = () => { if (!finishing && !panelKind && (document.hasFocus() || !body.classList.contains('overlay'))) finish(); };
field.onkeydown = e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!items.length) return;
    sel = (sel + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
    [...sugg.children].forEach((li, i) => li.classList.toggle('on', i === sel));
  } else if (e.key === 'Enter') { e.preventDefault(); pick(items[sel]); }
  else if (e.key === 'Escape') { e.preventDefault(); finish(); }
};
field.onfocus = () => { if (!body.classList.contains('overlay') && mode !== 'tabs') { mode = 'here'; query(); } };

// History and bookmarks panels
const pq = $('pq');
function panel(o) {
  panelKind = o.kind;
  body.classList.add('overlay', 'panel');
  $('panel').classList.add('open');
  $('panel').classList.remove('settings');
  $('ptitle').textContent = o.kind === 'history' ? 'History' : 'Bookmarks';
  if (document.activeElement !== pq) { pq.value = ''; pq.focus(); }
  const list = $('plist'); list.replaceChildren();
  if (!o.items.length) list.append(el('div', 'row u', 'Nothing here yet.'));
  for (const it of o.items) {
    const r = el('div', 'row');
    r.append(icon(it), el('span', 't', it.title || it.url),
             el('span', 'u', it.last ? new Date(it.last * 1000).toLocaleString() : hostOf(it.url)));
    if (o.kind === 'bookmarks') {
      const x = el('button', 'x', '×'); x.style.visibility = 'visible';
      x.style.cssText += 'border:0;background:none;color:var(--dim);font-size:14px';
      x.onclick = e => { e.stopPropagation(); post({ cmd: 'unbookmark', url: it.url }); };
      r.append(x);
    }
    r.title = it.url;
    r.onclick = () => { closePanel(); body.classList.remove('overlay'); post({ cmd: 'go', text: it.url, mode: 'here' }); };
    list.append(r);
  }
}
function closePanel() { panelKind = null; $('panel').classList.remove('open', 'settings'); body.classList.remove('panel'); }

// Settings: one section at a time; every change applies at once and the app
// sends the panel back.
let settingsAt = 'start';
const SECTIONS = [
  ['start', 'General', '&#xE80F;'], ['appearance', 'Appearance', '&#xE790;'], ['shields', 'Shields', '&#xEA18;'],
  ['privacy', 'Privacy', '&#xE72E;'], ['autofill', 'Passwords and autofill', '&#xE8D7;'], ['extensions', 'Extensions', '&#xEA86;'],
  ['downloads', 'Downloads', '&#xE896;'], ['languages', 'Languages', '&#xF2B7;'], ['system', 'System', '&#xE7F8;'],
  ['about', 'About Brisklark', '&#xE946;'],
];
function settingsGo(key) {
  settingsAt = key;
  for (const s of $('plist').children) s.classList.toggle('on', s.id === 's-' + key);
  for (const b of $('snav').children) b.classList.toggle('on', b.dataset.k === key);
  $('plist').scrollTop = 0;
}
function settings(o) {
  panelKind = 'settings';
  body.classList.add('overlay', 'panel');
  const p = $('panel'), list = $('plist'), nav = $('snav'), keep = list.scrollTop, fresh = !p.classList.contains('settings');
  p.classList.add('open', 'settings');
  $('ptitle').textContent = 'Settings';
  list.replaceChildren(); nav.replaceChildren();
  for (const [k, title, icon] of SECTIONS) {
    const b = el('button', k === settingsAt ? 'on' : '');
    b.dataset.k = k;
    const i = el('span', 'ic'); i.innerHTML = icon;
    b.append(i, el('span', null, title));
    b.onclick = () => settingsGo(k);
    nav.append(b);
  }
  const set = (key, value) => post({ cmd: 'set', key, value });
  let page, card;
  const sec = (key, title) => {
    page = el('section', 'page' + (key === settingsAt ? ' on' : '')); page.id = 's-' + key;
    page.append(el('h3', null, title)); card = el('div', 'card'); page.append(card); list.append(page);
  };
  const sub = title => { page.append(el('h4', null, title)); card = el('div', 'card'); page.append(card); };
  const note = text => { const r = el('div', 'set'); r.append(el('span', 't hint', text)); card.append(r); return r; };
  const row = (label, hint, control) => {
    const r = el('div', 'set'), t = el('span', 't', label);
    if (hint) t.append(el('span', 'hint', hint));
    r.append(t);
    if (control) r.append(control);
    card.append(r); return r;
  };
  const seg = (key, value, options) => {
    const s = el('div', 'seg');
    for (const [v, text] of options) {
      const b = el('button', v === value ? 'on' : '', text);
      b.onclick = () => set(key, v);
      s.append(b);
    }
    return s;
  };
  const toggle = (on, f) => { const c = el('input', 'sw'); c.type = 'checkbox'; c.checked = on; c.onchange = () => f(c.checked); return c; };
  const sw = (key, on) => toggle(on, v => set(key, v));
  const pref = name => toggle(o.prefs[name], v => set('pref', { name, on: v }));
  const btn = (text, onclick, disabled) => { const b = el('button', 'btn', text); b.onclick = onclick; b.disabled = !!disabled; return b; };
  const group = (...items) => { const g = el('div', 'grp'); g.append(...items); return g; };
  const sure = (text, done, label = 'Click again to confirm') => {
    const b = btn(text, () => {
      if (b.classList.contains('warn')) { done(); b.textContent = 'Done'; b.disabled = true; b.classList.remove('warn'); return; }
      b.classList.add('warn'); b.textContent = label;
      setTimeout(() => { if (b.classList.contains('warn')) { b.classList.remove('warn'); b.textContent = text; } }, 4000);
    });
    return b;
  };
  const clear = what => sure('Clear', () => set('clear', what), 'Click again to clear');
  const open = url => { closePanel(); body.classList.remove('overlay'); set('open', url); };
  const select = (options, value, onchange) => {
    const s = el('select');
    for (const [v, t] of options) { const opt = el('option', null, t); opt.value = v; opt.selected = v === value; s.append(opt); }
    s.onchange = () => onchange(s.value);
    return s;
  };

  sec('start', 'General');
  row('On startup', o.startup === 'new' ? 'Pinned tabs are kept' : 'Tabs load when you click them',
      seg('startup', o.startup, [['continue', 'Continue where I left off'], ['new', 'New tab']]));
  const known = o.engines.some(([, url]) => url === o.engine);
  row('Search engine', 'Used in the address bar',
      select((known ? o.engines : [...o.engines, ['Custom', o.engine]]).map(([n, u]) => [u, n]), o.engine, v => set('engine', v)));
  sub('Import and export');
  if (o.sources.length) row('From another browser', 'Bookmarks and history', group(...o.sources.map((label, i) => btn(label, () => set('import', 1000 + i)))));
  row('From a file', 'A bookmarks .html file', btn('Choose file…', () => set('import', 40)));
  row('Export', o.bookmarks + ' bookmarks · ' + o.history + ' history entries',
      group(btn('Bookmarks', () => set('import', 41), !o.bookmarks), btn('History', () => set('import', 42), !o.history)));

  sec('appearance', 'Appearance');
  row('Tabs', 'Ctrl+Shift+S', seg('top', o.top, [[true, 'Top'], [false, 'Left']]));
  row('Hide the tabs', 'Ctrl+S shows them again', sw('folded', o.folded));
  row('Page zoom', 'Ctrl+plus and Ctrl+minus change one tab',
      select([0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2].map(z => [String(z), Math.round(z * 100) + '%']),
             String([0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2].find(z => Math.abs(z - o.zoom) < 0.001) ?? 1), v => set('zoom', parseFloat(v))));

  sec('shields', 'Shields');
  row('Block ads and trackers', 'Brave\'s engine and lists', sw('shields', o.shields));
  row('Blocking level', 'Aggressive also blocks a site\'s own ads',
      (() => { const s = el('div', 'seg');
        for (const [v, t] of [[false, 'Standard'], [true, 'Aggressive']]) { const b = el('button', v === o.prefs.aggressive ? 'on' : '', t); b.onclick = () => set('pref', { name: 'aggressive', on: v }); s.append(b); }
        return s; })());
  row('Block cookie notices', 'Consent banners and pop-ups', sw('cookies', o.cookies));
  row('Block fingerprinting', 'Canvas, audio and hardware details vary per session', pref('fingerprint'));
  row('Upgrade to HTTPS', 'Falls back to http when a site has no https', pref('https'));
  row('Remove tracking from links', 'fbclid, utm_source and the like', pref('query'));
  row('Skip tracking redirects', 'Goes straight to where a link leads', pref('debounce'));
  row('Send Global Privacy Control', 'Asks sites not to sell or share your data', pref('gpc'));
  const when = o.updating ? 'Updating…' : o.updated ? 'Updated ' + new Date(o.updated * 1000).toLocaleString() : 'Not downloaded yet';
  row('Filter lists', when + ' · refreshed every 4 days', btn('Update now', () => set('update', true), o.updating));
  const listRows = (title, items) => {
    if (!items.length) return;
    sub(title);
    for (const l of items) row(l.title, l.desc, toggle(l.on, v => set('list', { uuid: l.uuid, on: v })));
  };
  listRows('Optional lists', o.lists.filter(l => !l.regional));
  listRows('Regional lists', o.lists.filter(l => l.regional));
  if (o.off.length) {
    sub('Sites with Shields down');
    for (const h of o.off) row(h, null, btn('Remove', () => set('unshield', h)));
  }

  sec('privacy', 'Privacy');
  row('Browsing history', 'History and recently closed tabs', clear('history'));
  row('Cookies and site data', 'Signs you out of websites', clear('cookies'));
  row('Cached images and files', 'Pages may load slower once', clear('cache'));
  row('Private tabs', 'Ctrl+Shift+N · nothing is kept when they close', null);

  sec('autofill', 'Passwords and autofill');
  row('Offer to save passwords', null, sw('passwords', o.passwords));
  row('Save and fill addresses and forms', 'Names, addresses, phone numbers', sw('autofill', o.autofill));
  row('Remove saved passwords and forms', 'Cleared with cookies and site data', btn('Privacy', () => settingsGo('privacy')));

  sec('extensions', 'Extensions');
  if (!o.extsOk) note('This PC\'s WebView2 runtime is too old for extensions. Update Microsoft Edge WebView2 to use them.');
  const link = el('input', 'txt'); link.placeholder = 'Chrome Web Store link'; link.spellcheck = false;
  link.onkeydown = e => { if (e.key === 'Enter') set('ext-install', link.value); };
  row('Install', o.installing ? 'Installing…' : 'Or open an extension\'s page and press Add to Brisklark',
      group(link, btn('Install', () => set('ext-install', link.value), o.installing || !o.extsOk)));
  row('Find extensions', null, group(btn('Chrome Web Store', () => open('https://chromewebstore.google.com/')),
      btn('Load unpacked…', () => set('ext-unpacked', true), !o.extsOk)));
  sub('Installed');
  if (!o.exts.length) note('No extensions yet.');
  for (const x of o.exts) {
    const g = group();
    if (x.popup || x.options) g.append(btn('Open', () => { closePanel(); body.classList.remove('overlay'); set('ext-open', x.id); }));
    if (x.options) g.append(btn('Options', () => { closePanel(); body.classList.remove('overlay'); set('ext-options', x.id); }));
    g.append(sure('Remove', () => set('ext-remove', x.id)), toggle(x.enabled, v => set('ext-enable', { id: x.id, on: v })));
    row(x.name, null, g);
  }

  sec('downloads', 'Downloads');
  row('Location', o.downloads || 'Downloads', btn('Change…', () => set('downloads', true)));
  row('Show downloads', 'Ctrl+J', btn('Open', () => set('show-downloads', true)));

  sec('languages', 'Languages');
  row('Preferred language', 'Websites use it when they can · after a relaunch',
      select([['', 'Same as Windows (' + navigator.language + ')'], ['en-US', 'English (US)'], ['en-GB', 'English (UK)'], ['af', 'Afrikaans'], ['de', 'Deutsch'], ['es', 'Español'], ['fr', 'Français'], ['it', 'Italiano'], ['nl', 'Nederlands'], ['pt-BR', 'Português (Brasil)'], ['pl', 'Polski'], ['tr', 'Türkçe'], ['ru', 'Русский'], ['ar', 'العربية'], ['hi', 'हिन्दी'], ['ja', '日本語'], ['ko', '한국어'], ['zh-CN', '中文 (简体)']],
             o.language, v => set('language', v)));

  sec('system', 'System');
  row('Graphics acceleration', 'Turn off if pages flicker · after a relaunch', sw('gpu', o.gpu));
  row('Proxy', 'Windows\' proxy settings apply', btn('Open', () => set('winsettings', 'network-proxy')));
  row('Accessibility', 'Windows\' text size, contrast and captions apply', btn('Open', () => set('winsettings', 'easeofaccess')));
  row('Relaunch Brisklark', 'Your tabs come back', btn('Relaunch', () => set('relaunch', true)));
  row('Reset settings', 'Keeps tabs, bookmarks, history and extensions', sure('Reset', () => set('reset', true)));

  sec('about', 'About Brisklark');
  const logo = el('div', 'about');
  const src = el('a', null, 'Source code');
  src.onclick = () => open('https://github.com/Voltexs/brisklark');
  const txt = el('div');
  txt.append(el('div', 'name', 'Brisklark ' + o.version), el('div', 'hint', 'MIT licence · '), el('div', 'hint',
    'Based on Search by Office Commun (MIT). Ad blocking: Brave\'s adblock-rust (MPL-2.0); filter lists by uBlock Origin, EasyList, Brave and others, under their own licences.'));
  txt.children[1].append(src);
  logo.append(txt); card.append(logo);

  if (fresh) settingsGo(settingsAt); else list.scrollTop = keep;
  if (!p.contains(document.activeElement)) { p.tabIndex = -1; p.focus(); }
}
pq.oninput = () => post({ cmd: 'panel', kind: panelKind, q: pq.value });
pq.onkeydown = e => { if (e.key === 'Escape') { closePanel(); finish(); } };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && panelKind) { closePanel(); finish(); } });
// A click on the empty space around the box or a panel puts it away, as Esc does,
// whether or not the box had the cursor.
document.addEventListener('mousedown', e => {
  if (!body.classList.contains('overlay') || e.target.closest('#box, #panel, #side')) return;
  e.preventDefault();
  closePanel(); finish();
});

// Empty parts of the tab row or sidebar hold the window, as a title bar would.
const side = $('side');
const holds = t => t === side || t === $('win') || t === $('tabs') || t === $('pins');
side.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (e.clientY <= 4 && !body.classList.contains('overlay')) { e.preventDefault(); return post({ cmd: 'resize-top' }); }
  if (holds(e.target) && e.detail === 1) { e.preventDefault(); post({ cmd: 'drag' }); }
});
side.addEventListener('dblclick', e => { if (holds(e.target)) post({ cmd: 'maximize' }); });
$('w-min').onclick = () => post({ cmd: 'minimize' });
$('w-max').onclick = () => post({ cmd: 'maximize' });
$('w-close').onclick = () => post({ cmd: 'quit' });

$('b-mark').onclick = () => post({ cmd: 'command', name: 'bookmark' });
$('b-shield').onclick = () => post({ cmd: 'command', name: 'shield' });
$('b-menu').onclick = () => post({ cmd: 'command', name: 'menu' });
$('b-ext').onclick = () => post({ cmd: 'command', name: 'extensions' });
$('n-back').onclick = () => post({ cmd: 'command', name: 'back' });
$('n-fwd').onclick = () => post({ cmd: 'command', name: 'forward' });
$('n-reload').onclick = () => post({ cmd: 'command', name: S.loading ? 'stop' : 'reload' });
$('addr').onclick = () => post({ cmd: 'command', name: 'field' });
post({ cmd: 'ready' });
</script>
</body>
